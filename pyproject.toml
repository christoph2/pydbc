[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "pyvndb"
version = "1.0.124"
description = "Vehicle description file handling for Python"
authors = [
    {name = "Christoph Schueler", email = "cpu12.gems@googlemail.com"}
]
readme = "README.md"
license = {text = "GPL-2.0-only"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "chardet>=5.0.0",
    "mako>=1.2.0",
    "colorama>=0.4.6",
    "SQLAlchemy>=2.0.0",
    "typing-extensions>=4.0.0",
    "arcrc>=0.1.1,<0.2.0",
]

[project.optional-dependencies]
can = ["python-can"]
dev = [
    "pytest>=7.0.0",
    "pytest-runner>=6.0.0",
    "black>=25.1,<27.0",
    "bumpver",
]
docs = [
    "sphinx",
    "myst-parser",
    "numpydoc",
]

[project.urls]
Repository = "https://www.github.com/Christoph2/pydbc"

[project.scripts]
vndb_importer = "pydbc.scripts.vndb_importer:main"
vndb_exporter = "pydbc.scripts.vndb_exporter:main"
pydbc-codegen = "pydbc.scripts.codegen:main"
pydbc_codegen = "pydbc.scripts.codegen:main"

[tool.poetry]
package-mode = false

[tool.scikit-build]
wheel.packages = ["pydbc"]
# Mako-Templates für das Wheel einschließen
wheel.exclude = []

[tool.bumpver]
current_version = "1.0.124"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false
tag_name = "v{version}"

[tool.bumpver.file_patterns]
"pydbc/__init__.py" = [
    "__version__ = '{version}'",
]
"pydbc/version.py" = [
    "__version__ = '{version}'",
]
"pyproject.toml" = [
    'version = "{version}"',
]

[tool.cibuildwheel]
build-verbosity = 3
build = "cp3{10,11,12,13,14}-*"
skip = ["*_i686", "*-musllinux*"]
build-frontend = "build"

[tool.pytest.ini_options]
addopts = [
  "--verbose",
  "--tb=short",
  "--junitxml=result.xml",
  "-o",
  "junit_family=xunit2",
]
testpaths = ["pydbc/tests"]
